<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entropy: microgravity fire-safety atlas</title>
  <meta name="description" content="A fire-safety atlas of NASA microgravity combustion research: every value traced to its source sentence or table." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="top">
    <div class="sky" aria-hidden="true"><span class="shoot s1"></span><span class="shoot s2"></span><span class="shoot s3"></span></div>
    <svg class="orbit" viewBox="0 0 600 600" aria-hidden="true">
      <circle cx="300" cy="300" r="290" fill="none" stroke="currentColor" stroke-width="1.2" />
      <circle cx="300" cy="300" r="200" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 7" />
    </svg>
    <svg class="star star-1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 7.6 16.4 11.1 24 12C16.4 12.9 12.9 16.4 12 24C11.1 16.4 7.6 12.9 0 12C7.6 11.1 11.1 7.6 12 0Z" /></svg>
    <svg class="star star-2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 7.6 16.4 11.1 24 12C16.4 12.9 12.9 16.4 12 24C11.1 16.4 7.6 12.9 0 12C7.6 11.1 11.1 7.6 12 0Z" /></svg>
    <svg class="star star-3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C12.9 7.6 16.4 11.1 24 12C16.4 12.9 12.9 16.4 12 24C11.1 16.4 7.6 12.9 0 12C7.6 11.1 11.1 7.6 12 0Z" /></svg>
    <div class="brand">
      <p class="eyebrow">NASA Space Apps 2026 · Flame in Freefall</p>
      <h1>Entropy</h1>
      <p class="tag">A fire-safety atlas of microgravity combustion research</p>
    </div>
    <div class="top-right"><div class="stats" id="stats"></div><a class="about-link" href="#about">About</a></div>
  </header>
  <section class="add" id="add"></section>
  <section class="controls" id="controls"></section>
  <main>
    <div class="status" id="status" role="status"></div>
    <section class="atmap" id="atmap"></section>
    <div class="table-wrap"><table id="catalogue"></table></div>
    <section id="compare" class="compare" hidden></section>
    <section id="about" class="about"></section>
  </main>
  <aside class="panel" id="panel" hidden aria-live="polite"></aside>
  <footer id="footer"></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
